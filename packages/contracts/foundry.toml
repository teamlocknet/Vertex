[profile.default]
src = "src"
out = "out"
libs = ["lib", "../../lib"]
cache_path = "cache"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=../../lib/openzeppelin-contracts/"
]

fs_permissions = [{ access = "read-write", path = "../backend/" }]

# Configuración del Compilador (Congelada en CLAUDE.md)
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256
